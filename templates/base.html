<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trekking App</title>

    <!-- Bootstrap is used for styling the page layout and buttons. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Shared navigation bar shown on all pages. -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Trekking App</a>
            <div>
                <a class="btn btn-outline-light" href="/login">Login</a>
                <a class="btn btn-primary" href="/register">Register</a>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-info">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <!-- Child templates insert their page-specific content here. -->
        {% block content %}{% endblock %}
    </div>
</body>
</html>
