{% extends 'base.html' %}

{% block content %}
<!-- This form lets an admin create a new trek and assign it to approved staff. -->
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2 class="mb-4">Create a New Trek</h2>

        <!-- Flash messages appear here if the admin forgets to choose a staff member. -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/create_trek">
            <div class="mb-3">
                <label>Trek Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="Beginner">Beginner</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Expert">Expert</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Location</label>
                <input type="text" name="location" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Total Slots Available</label>
                <input type="number" name="total_slots" class="form-control" min="1" required>
            </div>

            <div class="mb-3">
                <label>Assign Staff</label>
                <select name="staff_id" class="form-select" required>
                    <option value="" disabled selected>Select an approved staff member...</option>
                    {% for staff in approved_staff %}
                        <option value="{{ staff.id }}">{{ staff.username }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create Trek</button>
            <a href="/dashboard" class="btn btn-secondary w-100 mt-2">Cancel</a>
        </form>

    </div>
</div>
{% endblock %}
